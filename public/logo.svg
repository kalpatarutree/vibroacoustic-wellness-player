<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 248" fill="none">
  <style>
    @keyframes ripple {
      0%   { opacity: 1; }
      30%  { opacity: 0.1; }
      60%  { opacity: 1; }
      100% { opacity: 1; }
    }
    .r0 { animation: ripple 7.5s ease-in-out infinite 0s; }
    .r1 { animation: ripple 7.5s ease-in-out infinite 0.25s; }
    .r2 { animation: ripple 7.5s ease-in-out infinite 0.5s; }
    .r3 { animation: ripple 7.5s ease-in-out infinite 0.75s; }
    .r4 { animation: ripple 7.5s ease-in-out infinite 1.0s; }
    .r5 { animation: ripple 7.5s ease-in-out infinite 1.25s; }
    .r6 { animation: ripple 7.5s ease-in-out infinite 1.5s; }
  </style>

  <!-- center dot -->
  <circle class="r0" cx="100" cy="96" r="6.5" fill="white"/>

  <!-- ring 1 — solid -->
  <circle class="r1" cx="100" cy="96" r="17" stroke="white" stroke-width="5"/>

  <!-- ring 2 — solid -->
  <circle class="r2" cx="100" cy="96" r="28" stroke="white" stroke-width="4.5"/>

  <!-- ring 3 — 4 arcs -->
  <circle class="r3" cx="100" cy="96" r="39.5" stroke="white" stroke-width="4.5"
    pathLength="100" stroke-dasharray="21 4" stroke-dashoffset="98"/>

  <!-- ring 4 -->
  <circle class="r4" cx="100" cy="96" r="51.5" stroke="white" stroke-width="4"
    pathLength="100" stroke-dasharray="21 4" stroke-dashoffset="98"/>

  <!-- ring 5 -->
  <circle class="r5" cx="100" cy="96" r="64" stroke="white" stroke-width="3.5"
    pathLength="100" stroke-dasharray="21 4" stroke-dashoffset="98"/>

  <!-- ring 6 — outermost -->
  <circle class="r6" cx="100" cy="96" r="77" stroke="white" stroke-width="3"
    pathLength="100" stroke-dasharray="21 4" stroke-dashoffset="98"/>

  <!-- label -->
  <text x="100" y="194" text-anchor="middle"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="12" font-weight="700" letter-spacing="5"
    fill="white" opacity="0.9">VIBROACOUSTIC</text>
  <text x="100" y="213" text-anchor="middle"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="12" font-weight="700" letter-spacing="9"
    fill="white" opacity="0.9">WELLNESS</text>

</svg>
